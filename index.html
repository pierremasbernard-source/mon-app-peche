<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet de pêche</title>

  <!-- Leaflet (carte interactive) via CDN, tuiles OpenStreetMap, pas de clé API -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ============================================================= -->
  <!-- ÉCRAN DE SÉLECTION DE PROFIL (premier écran au démarrage)      -->
  <!-- ============================================================= -->
  <div id="profile-gate" class="profile-gate">
    <div class="profile-card">
      <div class="profile-logo">🎣</div>
      <h1>Carnet de pêche</h1>
      <p class="muted">Chasse sous-marine &amp; pêche à la canne</p>

      <div id="profile-list" class="profile-list"><!-- rempli en JS --></div>

      <div class="profile-create">
        <input type="text" id="new-profile-name" placeholder="Nom du nouveau profil" maxlength="40" />
        <button id="create-profile-btn" class="btn btn-primary">Créer</button>
      </div>
    </div>
  </div>

  <!-- ============================================================= -->
  <!-- APPLICATION PRINCIPALE                                        -->
  <!-- ============================================================= -->
  <div id="app" class="app hidden">
    <!-- Barre de navigation latérale (devient barre du bas sur mobile) -->
    <nav class="nav">
      <div class="nav-brand">
        <span class="nav-logo">🎣</span>
        <span class="nav-title">Carnet de pêche</span>
      </div>
      <ul class="nav-links">
        <li><button class="nav-link active" data-view="map"><span class="nav-icon">🗺️</span><span>Carte</span></button></li>
        <li><button class="nav-link" data-view="sessions"><span class="nav-icon">📋</span><span>Sessions</span></button></li>
        <li><button class="nav-link" data-view="planner"><span class="nav-icon">🧭</span><span>Planifier</span></button></li>
        <li><button class="nav-link" data-view="stats"><span class="nav-icon">📊</span><span>Stats</span></button></li>
        <li><button class="nav-link" data-view="gallery"><span class="nav-icon">📷</span><span>Galerie</span></button></li>
      </ul>
      <div class="nav-footer">
        <button id="profile-switch" class="nav-profile" title="Changer de profil">
          <span class="nav-avatar" id="nav-avatar">?</span>
          <span class="nav-profile-name" id="nav-profile-name">Profil</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <!-- ---------- VUE CARTE ---------- -->
      <section class="view active" id="view-map">
        <header class="view-header">
          <h2>Carte des spots</h2>
          <p class="muted">Cliquez sur la carte pour ajouter un spot</p>
        </header>
        <div class="map-wrapper">
          <div id="map"></div>
          <div class="map-legend">
            <span><i class="dot dot-mer"></i> Mer</span>
            <span><i class="dot dot-douce"></i> Eau douce</span>
          </div>
        </div>
      </section>

      <!-- ---------- VUE SESSIONS ---------- -->
      <section class="view" id="view-sessions">
        <header class="view-header">
          <h2>Mes sessions</h2>
          <button id="new-session-btn" class="btn btn-primary">+ Nouvelle session</button>
        </header>
        <div id="sessions-list" class="sessions-list"><!-- rempli en JS --></div>
      </section>

      <!-- ---------- VUE PLANIFICATEUR ---------- -->
      <section class="view" id="view-planner">
        <header class="view-header">
          <h2>Quand y aller ?</h2>
          <p class="muted">Estimez les conditions et consultez votre historique de réussite</p>
        </header>
        <div id="planner-content" class="planner-content"><!-- rempli en JS --></div>
      </section>

      <!-- ---------- VUE STATISTIQUES ---------- -->
      <section class="view" id="view-stats">
        <header class="view-header">
          <h2>Statistiques &amp; badges</h2>
          <div class="header-actions">
            <button id="export-btn" class="btn btn-ghost">⬇ Exporter</button>
            <button id="import-btn" class="btn btn-ghost">⬆ Importer</button>
            <input type="file" id="import-file" accept="application/json" hidden />
          </div>
        </header>
        <div id="stats-content" class="stats-content"><!-- rempli en JS --></div>
      </section>

      <!-- ---------- VUE GALERIE ---------- -->
      <section class="view" id="view-gallery">
        <header class="view-header">
          <h2>Galerie des prises</h2>
        </header>
        <div id="gallery-content" class="gallery-content"><!-- rempli en JS --></div>
      </section>
    </main>
  </div>

  <!-- ============================================================= -->
  <!-- MODALES (réutilisables)                                       -->
  <!-- ============================================================= -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-body" id="modal-body"><!-- rempli dynamiquement --></div>
    </div>
  </div>

  <!-- Toast de notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- ============================================================= -->
  <!-- SCRIPTS                                                       -->
  <!-- ============================================================= -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Modules de l'application (ordre important : storage avant le reste) -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/tides.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
